name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so this also
      # catches the "works on my machine" case where a dependency was
      # installed locally but never committed.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Build with no secrets present: the app must degrade gracefully
      # rather than crash when GEMINI_API_KEY and DATABASE_URL are absent.
      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
